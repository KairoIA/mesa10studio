<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A · El plano fijo — Mesa 10 Studio</title>
<link rel="icon" href="../img/favicon.svg" type="image/svg+xml">
<style>
/* ============================================================
   DIRECCIÓN A — "El plano fijo"
   Robado de carlesfaus.com: el wordmark gigante detrás, tapado por
   la obra; retícula rota; una sola talla de interfaz.
   Devuelto a Mesa 10: sobre el escenario, no sobre blanco. El color
   sigue siendo el de MARCA.md.
   ============================================================ */
@font-face{font-family:'Cormorant Garamond';font-weight:300;font-display:swap;
  src:url('../fonts/CormorantGaramond-300.woff2') format('woff2')}
@font-face{font-family:'Cormorant Garamond';font-weight:400;font-display:swap;
  src:url('../fonts/CormorantGaramond-400.woff2') format('woff2')}
@font-face{font-family:'Jost';font-weight:300;font-display:swap;
  src:url('../fonts/Jost-Light.woff2') format('woff2')}
@font-face{font-family:'Jost';font-weight:500;font-display:swap;
  src:url('../fonts/Jost-Medium.woff2') format('woff2')}

:root{
  --tinta:#141414; --hueso:#F3E5D9; --azul:#294C62;
  --terracota:#CD7D54; --azul-claro:#5E93B4;
  /* UNA sola talla de interfaz. Como Carles Faus. */
  --ui:.72rem; --track:.22em;
  --ease:cubic-bezier(.22,.61,.36,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{
  background:var(--hueso);
  font-family:'Cormorant Garamond',serif;
  color:var(--tinta);
  -webkit-font-smoothing:antialiased;
}
.ui{
  font-family:'Jost',sans-serif;font-weight:300;
  font-size:var(--ui);letter-spacing:var(--track);text-transform:uppercase;
}

/* ── El escenario, quieto y al fondo ─────────────────────── */
.escena{position:fixed;inset:0;z-index:0}
.escena img{width:100%;height:100%;object-fit:cover}
.escena::after{content:'';position:absolute;inset:0;
  background:rgba(243,229,217,.55)}

/* ── El wordmark gigante. Se sale de la pantalla a propósito ── */
.marca{
  position:fixed;left:50%;top:50%;translate:-50% -50%;
  z-index:1;width:135vw;max-width:none;pointer-events:none;
  opacity:.92;
}

/* ── Las piezas, en retícula rota ────────────────────────── */
.pieza{
  position:fixed;z-index:2;cursor:pointer;
  transition:transform .7s var(--ease),filter .7s var(--ease);
  filter:grayscale(1) contrast(1.05);
}
.pieza video{width:100%;display:block;background:var(--tinta)}
.pieza:hover{transform:scale(1.04);filter:none;z-index:5}
.pieza figcaption{
  font-family:'Jost',sans-serif;font-weight:300;
  font-size:var(--ui);letter-spacing:var(--track);text-transform:uppercase;
  margin-top:.7rem;color:var(--tinta);opacity:.55;
  transition:opacity .5s var(--ease);
}
.pieza:hover figcaption{opacity:1}

/* Posiciones deliberadamente dispares: ni fila, ni rejilla. Pero el centro
   es zona protegida —de 27vw a 73vw— porque ahí va la frase y el wordmark:
   desorden buscado, no descuido. */
.p1{left:5vw;   top:11vh;   width:13.5vw}
.p2{right:5vw;  top:8vh;    width:12vw}
.p3{left:41vw;  bottom:5vh; width:10.5vw}
.p4{right:6.5vw;bottom:12vh;width:13.5vw}

/* ── Interfaz: toda igual, repartida por los bordes ──────── */
.borde{position:fixed;z-index:6;display:flex;gap:2.2rem}
.arriba{top:2.2rem;left:50%;translate:-50% 0}
.abajo-izq{bottom:2.2rem;left:2.2rem}
.abajo-der{bottom:2.2rem;right:2.2rem}
.arriba-izq{top:2.2rem;left:2.2rem}
.arriba-der{top:2.2rem;right:2.2rem}
.borde a{color:var(--tinta);text-decoration:none;opacity:.6;
  transition:opacity .35s var(--ease)}
.borde a:hover{opacity:1}
.borde a::before{content:'[';opacity:.4}
.borde a::after{content:']';opacity:.4}
.act{color:var(--azul)!important;opacity:1!important}

/* ── La frase, a un lado. El centro es de la marca ───────── */
.centro{
  position:fixed;left:5vw;bottom:14vh;
  z-index:3;text-align:left;width:min(26rem,34vw);pointer-events:none;
}
.centro h1{
  font-weight:300;font-size:clamp(1.5rem,2.1vw,2.15rem);
  line-height:1.12;text-wrap:pretty;
}
.centro .quien{
  margin-top:1.2rem;color:var(--azul);
  font-family:'Jost',sans-serif;font-weight:300;
  font-size:var(--ui);letter-spacing:var(--track);text-transform:uppercase;
}

.nota{
  position:fixed;bottom:2.2rem;left:50%;translate:-50% 0;z-index:6;
  color:var(--tinta);opacity:.45;
}
@media (max-width:820px){
  .pieza,.marca{display:none}
  .centro{width:88vw}
  .borde{gap:1.2rem}
  .arriba{display:none}
}
</style>
</head>
<body>

<div class="escena"><img src="../img/escena_h.jpg" alt=""></div>

<img class="marca" src="../img/mesa10_wordmark_color.svg" alt="Mesa 10 Studio">

<figure class="pieza p1">
  <video src="../media/chef.mp4" muted loop playsinline preload="none"
         poster="../img/poster_chef.jpg"></video>
  <figcaption>Chef Roberto Vera</figcaption>
</figure>
<figure class="pieza p2">
  <video src="../media/serenica.mp4" muted loop playsinline preload="none"
         poster="../img/poster_serenica.jpg"></video>
  <figcaption>Serénica</figcaption>
</figure>
<figure class="pieza p3">
  <video src="../media/lucy.mp4" muted loop playsinline preload="none"
         poster="../img/poster_lucy.jpg"></video>
  <figcaption>Lucy Rivero</figcaption>
</figure>
<figure class="pieza p4">
  <video src="../media/urban.mp4" muted loop playsinline preload="none"
         poster="../img/poster_urban.jpg"></video>
  <figcaption>Urban · para marcas</figcaption>
</figure>

<div class="centro">
  <h1>Producción audiovisual y automatización de procesos con IA.</h1>
  <p class="quien">Autónomos, creadores de contenido y pymes</p>
</div>

<nav class="borde arriba ui">
  <a href="#" class="act">Trabajo</a>
  <a href="#">Qué hago</a>
  <a href="#">Contacto</a>
</nav>
<div class="borde arriba-izq ui"><a href="../index.html">Volver</a></div>
<div class="borde arriba-der ui"><a href="#" class="act">ES</a><a href="#">EN</a></div>
<div class="borde abajo-izq ui"><a href="#">Instagram</a><a href="#">LinkedIn</a></div>
<div class="borde abajo-der ui"><a href="#">javier@mesa10studio.com</a></div>
<p class="nota ui">Pasa el ratón por una pieza</p>

<script>
/* Los vídeos entran en gris y se encienden al pasar por encima. La marca
   se ve entera hasta que el trabajo la tapa: por eso las piezas cargan
   solo al acercarse, y no las cuatro de golpe. */
document.querySelectorAll('.pieza').forEach(function (fig) {
  var v = fig.querySelector('video');
  fig.addEventListener('mouseenter', function () {
    if (!v.dataset.on) { v.dataset.on = 1; v.load(); }
    v.play().catch(function () {});
  });
  fig.addEventListener('mouseleave', function () { v.pause(); });
});
</script>
</body>
</html>
